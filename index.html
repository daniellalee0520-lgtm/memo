<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>我的物品管理</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

  <div class="app">

    <!-- 顶部 -->
    <header class="topbar">
      <div>
        <div class="app-title">我的物品</div>
        <div class="app-subtitle">Inventory Manager</div>
      </div>

      <button class="person-btn" onclick="openPeopleModal()">
        👤
      </button>
    </header>


    <!-- 管理对象 -->
    <section class="person-selector">
      <label>当前管理对象</label>

      <select id="personSelect" onchange="changePerson()"></select>
    </section>


    <!-- 仪表盘 -->
    <section class="dashboard">

      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div>
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">物品</div>
        </div>
      </div>

      <div class="stat-card danger">
        <div class="stat-icon">⏰</div>
        <div>
          <div class="stat-number" id="expiredCount">0</div>
          <div class="stat-label">已过期</div>
        </div>
      </div>

      <div class="stat-card warning">
        <div class="stat-icon">📅</div>
        <div>
          <div class="stat-number" id="soonCount">0</div>
          <div class="stat-label">30天内到期</div>
        </div>
      </div>

      <div class="stat-card low">
        <div class="stat-icon">⚠️</div>
        <div>
          <div class="stat-number" id="lowCount">0</div>
          <div class="stat-label">余量告急</div>
        </div>
      </div>

    </section>


    <!-- 搜索 -->
    <section class="search-box">
      <span>🔎</span>
      <input
        type="search"
        id="searchInput"
        placeholder="搜索物品、品牌、规格、位置……"
        oninput="renderItems()"
      />
    </section>


    <!-- 筛选 -->
    <section class="filters">

      <select id="categoryFilter" onchange="renderItems()">
        <option value="all">全部分类</option>
      </select>

      <select id="statusFilter" onchange="renderItems()">
        <option value="all">全部状态</option>
        <option value="normal">正常</option>
        <option value="soon">即将到期</option>
        <option value="expired">已过期</option>
        <option value="low">余量告急</option>
        <option value="empty">已用完</option>
      </select>

      <select id="sortSelect" onchange="renderItems()">
        <option value="added-desc">最近添加</option>
        <option value="name">名称</option>
        <option value="expiry">到期日</option>
        <option value="quantity">余量</option>
        <option value="price">均价</option>
      </select>

    </section>


    <!-- 物品列表 -->
    <main id="itemList"></main>


    <!-- 底部按钮 -->
    <button class="add-button" onclick="openItemModal()">
      ＋ 添加物品
    </button>


    <!-- 数据管理 -->
    <section class="data-tools">

     <button onclick="exportExcel()">
  📤 Excel
</button>

<button onclick="document.getElementById('excelInput').click()">
  📥 导入
</button>

<button onclick="exportJSON()">
  💾 备份
</button>

<button onclick="document.getElementById('jsonInput').click()">
  📂 恢复
</button>

      <input
        type="file"
        id="excelInput"
        accept=".xlsx,.xls"
        hidden
        onchange="importExcel(event)"
      />

      <input
        type="file"
        id="jsonInput"
        accept=".json"
        hidden
        onchange="importJSON(event)"
      />

    </section>

  </div>


  <!-- ==================== 添加/编辑物品 ==================== -->

  <div class="modal" id="itemModal">

    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modalTitle">添加物品</h2>
        <button onclick="closeItemModal()">×</button>
      </div>


      <form id="itemForm" onsubmit="saveItem(event)">

        <input type="hidden" id="itemId" />


        <label>
          物品名称 *
          <input id="itemName" required placeholder="例如：维生素C" />
        </label>


        <div class="form-row">

          <label>
            品牌
            <input id="itemBrand" placeholder="例如：DHC" />
          </label>

          <label>
            分类
            <input id="itemCategory" placeholder="例如：保健品" />
          </label>

        </div>


        <div class="form-row">

          <label>
            规格
            <input id="itemSpec" placeholder="例如：1000mg" />
          </label>

          <label>
            单位
            <select id="itemUnit">
              <option value="个">个</option>
              <option value="片">片</option>
              <option value="粒">粒</option>
              <option value="袋">袋</option>
              <option value="瓶">瓶</option>
              <option value="支">支</option>
              <option value="盒">盒</option>
              <option value="包">包</option>
              <option value="套">套</option>
              <option value="件">件</option>
              <option value="次">次</option>
              <option value="其他">其他</option>
            </select>
          </label>

        </div>


        <!-- 价格功能 -->

        <div class="price-section">

          <div class="section-title">
            💰 价格信息
          </div>

          <div class="form-row">

            <label>
              总价格
              <input
                id="itemPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="例如：1200"
                oninput="updateAveragePrice()"
              />
            </label>

            <label>
              购买数量
              <input
                id="itemPurchaseQuantity"
                type="number"
                min="0"
                step="0.01"
                placeholder="例如：30"
                oninput="updateAveragePrice()"
              />
            </label>

          </div>


          <div class="average-price-box">

            <div>
              <span>自动计算均价</span>
              <small>总价格 ÷ 购买数量</small>
            </div>

            <strong id="averagePricePreview">
              ¥0.00 / 个
            </strong>

          </div>

        </div>


        <!-- 当前余量 -->

        <div class="form-row">

          <label>
            当前余量 *
            <input
              id="itemQuantity"
              type="number"
              min="0"
              step="0.01"
              required
              placeholder="例如：20"
            />
          </label>

          <label>
            最低余量
            <input
              id="itemMinimum"
              type="number"
              min="0"
              step="0.01"
              value="0"
              placeholder="例如：5"
            />
          </label>

        </div>


        <label>
          到期日
          <input id="itemExpiry" type="date" />
        </label>


        <label>
          存放位置
          <input id="itemLocation" placeholder="例如：厨房 / 抽屉A" />
        </label>


        <label>
          备注
          <textarea
            id="itemNotes"
            rows="3"
            placeholder="可以记录购买渠道、使用方法等"
          ></textarea>
        </label>


        <button class="submit-button" type="submit">
          保存
        </button>

      </form>

    </div>

  </div>


  <!-- ==================== 管理对象 ==================== -->

  <div class="modal" id="peopleModal">

    <div class="modal-content">

      <div class="modal-header">
        <h2>管理对象</h2>
        <button onclick="closePeopleModal()">×</button>
      </div>


      <div id="peopleList"></div>


      <div class="add-person">

        <input
          id="newPersonName"
          placeholder="例如：自己 / 妈妈 / 爸爸"
        />

        <button onclick="addPerson()">
          ＋ 添加
        </button>

      </div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
