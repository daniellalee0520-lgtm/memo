<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>我的物品管理</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <header class="header">

    <div>
      <div class="title-row">
        <h1>📦 我的物品</h1>
      </div>

      <p id="currentPersonText">管理：我自己</p>
    </div>

    <button id="addBtn" class="primary-btn">
      ＋ 添加
    </button>

  </header>


  <!-- 管理对象 -->
  <section class="person-bar">

    <select id="personSelect"></select>

    <button id="managePeopleBtn" class="icon-text-btn">
      👥
    </button>

  </section>


  <!-- 仪表盘 -->

  <section class="dashboard">

    <div class="stat-card">
      <div class="stat-icon">📦</div>
      <div>
        <div id="totalCount" class="stat-number">0</div>
        <div class="stat-label">物品</div>
      </div>
    </div>

    <div class="stat-card danger">
      <div class="stat-icon">🔴</div>
      <div>
        <div id="expiredCount" class="stat-number">0</div>
        <div class="stat-label">已过期</div>
      </div>
    </div>

    <div class="stat-card warning">
      <div class="stat-icon">🟠</div>
      <div>
        <div id="soonCount" class="stat-number">0</div>
        <div class="stat-label">即将到期</div>
      </div>
    </div>

    <div class="stat-card warning">
      <div class="stat-icon">⚠️</div>
      <div>
        <div id="lowCount" class="stat-number">0</div>
        <div class="stat-label">余量告急</div>
      </div>
    </div>

  </section>


  <!-- 搜索 -->

  <section class="search-box">

    <div class="search-input-wrap">

      <span>🔍</span>

      <input
        id="searchInput"
        type="search"
        placeholder="搜索物品名称、品牌、备注……"
      >

    </div>

  </section>


  <!-- 筛选 -->

  <section class="filters">

    <select id="categoryFilter">

      <option value="">
        全部分类
      </option>

    </select>


    <select id="statusFilter">

      <option value="">
        全部状态
      </option>

      <option value="expired">
        🔴 已过期
      </option>

      <option value="soon">
        🟠 30天内到期
      </option>

      <option value="low">
        ⚠️ 余量告急
      </option>

      <option value="empty">
        📭 已用完
      </option>

      <option value="normal">
        🟢 正常
      </option>

    </select>


    <select id="sortSelect">

      <option value="name">
        按名称
      </option>

      <option value="expiry">
        按到期日
      </option>

      <option value="quantity">
        按余量
      </option>

      <option value="created">
        按添加时间
      </option>

    </select>

  </section>


  <!-- 快捷操作 -->

  <section class="quick-actions">

    <button id="exportBtn">
      📤 Excel
    </button>

    <label>
      📥 导入
      <input
        id="importInput"
        type="file"
        accept=".xlsx,.xls,.csv"
      >
    </label>

    <button id="backupBtn">
      💾 备份
    </button>

    <label>
      📂 恢复
      <input
        id="backupInput"
        type="file"
        accept=".json"
      >
    </label>

  </section>


  <!-- 物品列表 -->

  <main>

    <div id="emptyState" class="empty-state hidden">

      <div class="empty-icon">
        📭
      </div>

      <h2>
        暂时没有物品
      </h2>

      <p>
        点击右上角“添加”开始记录。
      </p>

    </div>


    <div id="itemsList" class="items-list"></div>

  </main>

</div>



<!-- ========================= -->
<!-- 添加 / 编辑物品 -->
<!-- ========================= -->

<div id="itemModal" class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="modalTitle">
        添加物品
      </h2>

      <button
        class="close-btn"
        data-close="itemModal"
      >
        ×
      </button>

    </div>


    <form id="itemForm">

      <input
        id="itemId"
        type="hidden"
      >


      <label>
        物品名称 *
        <input
          id="name"
          required
          placeholder="例如：维生素C"
        >
      </label>


      <label>
        分类

        <input
          id="category"
          list="categoryList"
          placeholder="药品、食品、日用品……"
        >

        <datalist id="categoryList">

          <option value="药品">
          <option value="保健品">
          <option value="食品">
          <option value="饮料">
          <option value="化妆品">
          <option value="日用品">
          <option value="清洁用品">
          <option value="电子产品">
          <option value="其他">

        </datalist>

      </label>


      <div class="two-columns">

        <label>
          品牌
          <input id="brand">
        </label>

        <label>
          规格
          <input
            id="spec"
            placeholder="100片/瓶"
          >
        </label>

      </div>


      <div class="three-columns">

        <label>
          当前余量 *

          <input
            id="quantity"
            type="number"
            min="0"
            step="0.01"
            value="0"
            required
          >

        </label>


        <label>
          单位

          <select id="unit">

            <option>片</option>
            <option>袋</option>
            <option>瓶</option>
            <option>支</option>
            <option>个</option>
            <option>盒</option>
            <option>包</option>
            <option>罐</option>
            <option>卷</option>
            <option>套</option>
            <option>件</option>
            <option>箱</option>
            <option>其他</option>

          </select>

        </label>


        <label>
          最低余量

          <input
            id="minQuantity"
            type="number"
            min="0"
            step="0.01"
            value="0"
          >

        </label>

      </div>


      <div class="two-columns">

        <label>
          到期日

          <input
            id="expiryDate"
            type="date"
          >

        </label>


        <label>
          购买日期

          <input
            id="purchaseDate"
            type="date"
          >

        </label>

      </div>


      <label>
        存放位置

        <input
          id="location"
          placeholder="例如：卧室抽屉"
        >

      </label>


      <label>
        备注

        <textarea
          id="notes"
          rows="3"
          placeholder="例如：每天1片"
        ></textarea>

      </label>


      <div class="modal-actions">

        <button
          type="button"
          class="secondary-btn"
          data-close="itemModal"
        >
          取消
        </button>

        <button
          type="submit"
          class="primary-btn"
        >
          保存
        </button>

      </div>

    </form>

  </div>

</div>



<!-- ========================= -->
<!-- 管理对象 -->
<!-- ========================= -->

<div id="peopleModal" class="modal hidden">

  <div class="modal-content small-modal">

    <div class="modal-header">

      <h2>
        👥 管理对象
      </h2>

      <button
        class="close-btn"
        data-close="peopleModal"
      >
        ×
      </button>

    </div>


    <div id="peopleList"></div>


    <div class="add-person">

      <input
        id="newPerson"
        placeholder="例如：妈妈"
      >

      <button
        id="addPersonBtn"
        class="primary-btn"
      >
        添加
      </button>

    </div>


    <p class="small-text">

      不同管理对象的物品数据相互独立。

    </p>

  </div>

</div>



<!-- Toast -->

<div id="toast" class="toast"></div>


<script src="app.js"></script>

</body>
</html>
